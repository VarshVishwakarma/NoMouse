name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt offscreen runtime library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      # Tests use synthetic hands and fake input; the GUI is exercised offscreen.
      - name: Install test dependencies
        run: python -m pip install numpy opencv-python-headless PySide6-Essentials==6.12.0 pytest ruff
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build package
        run: python -m pip install --no-deps .
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies and auditor
        run: python -m pip install -r requirements.txt pip-audit
      - name: Audit resolved runtime dependencies
        run: python -m pip_audit -r requirements.txt

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and packager
        run: python -m pip install -r requirements.txt PyInstaller
      - name: Build Windows application
        run: python -m PyInstaller --clean --noconfirm nomouse.spec
      - name: Verify bundled hand model
        run: |
          if (-not (Test-Path .\dist\NoMouse\_internal\nomouse\models\hand_landmarker.task)) {
            throw "Bundled hand landmark model is missing"
          }
      - name: Smoke-test packaged application
        run: .\dist\NoMouse\NoMouse.exe --version
