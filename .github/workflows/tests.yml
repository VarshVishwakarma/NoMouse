name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite uses synthetic hands and fake input devices, so it needs neither a webcam,
      # MediaPipe, nor a desktop session. Only the lightweight libraries are installed here.
      - name: Install test dependencies
        run: python -m pip install numpy opencv-python-headless pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
